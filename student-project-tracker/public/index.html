
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Project Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Student Project Tracker</h1>
    <p>Manage your student projects easily.</p>

    <form id="project-form">
      <label for="name">Project Name</label>
      <input
        type="text"
        id="name"
        placeholder="Enter project name"
        required
      >

      <label for="status">Project Status</label>
      <select id="status" required>
        <option value="Planned">Planned</option>
        <option value="In Progress">In Progress</option>
        <option value="Completed">Completed</option>
      </select>

      <div class="form-buttons">
        <button type="submit" id="save-button">Add Project</button>
        <button type="button" id="cancel-button" hidden>
          Cancel edit
        </button>
      </div>
    </form>

    <section>
      <h2>My Projects</h2>
      <p id="empty-state">No projects yet. Add your first project!</p>
      <ul id="project-list"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
